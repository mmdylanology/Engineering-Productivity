rules:
  - id: no-hardcoded-business-params
    languages: [python]
    severity: ERROR
    message: >
      Hardcoding business constants is forbidden by INV-01.
      Declare all rates, limits, and multipliers in config/params.yaml and read via config.params.
    paths:
      include: ["src/core/"]
    pattern-regex: '(discount_rate|tax_rate|threshold_limit|interest_rate)\s*=\s*[0-9]+'
