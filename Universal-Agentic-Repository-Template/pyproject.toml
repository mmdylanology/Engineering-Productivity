[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agentic-template"
version = "0.1.0"
description = "Universal Agentic Engineering Repository Blueprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=0.10.0",
    "sqlglot>=20.0.0",
    "mcp>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-markdown-docs>=0.5.0",
    "ruff>=0.3.0",
    "semgrep>=1.60.0",
    "pre-commit>=3.5.0"
]
